# Mosquitto 2.x: без явного listener брокер приймає
# лише з'єднання з того самого комп'ютера (контейнера)
listener 1883

# Навчальний стенд: підключення без логіна й пароля.
# У реальній системі — заборонено (password_file, TLS)!
allow_anonymous true

# Зберігати сесії й повідомлення QoS 1/2 на диску
persistence true
persistence_location /mosquitto/data/

# Журнал — у стандартний вивід (docker compose logs)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
