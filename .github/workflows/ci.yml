name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Eco CI — старт вимірювання
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: start-measurement
          send-data: false
          co2-calculation-method: constant
          co2-grid-intensity-constant: 458

      - name: Отримати код репозиторію
        uses: actions/checkout@v4

      - name: Налаштувати Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Встановити залежності (крок "збірки")
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Eco CI — install
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: install

      - name: Перевірити стиль коду (flake8)
        run: flake8 . --max-line-length=100 --exclude=.venv,pr4,pr5,pr6

      - name: Eco CI — flake8
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: flake8

      - name: Запустити тести
        run: pytest -v

      - name: Eco CI — tests
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: tests

      - name: Eco CI — підсумок
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: display-results
          display-badge: false
  
  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Eco CI — старт вимірювання
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: start-measurement
          send-data: false
          co2-calculation-method: constant
          co2-grid-intensity-constant: 458

      - name: Отримати код репозиторію
        uses: actions/checkout@v4

      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
          -u ${{ github.actor }} --password-stdin

      - name: Зібрати Docker-образ (крок "Package")
        run: |
          IMAGE=ghcr.io/anastasik8/ci-lab-app
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest -t $IMAGE:v1.0.0 .

      - name: Eco CI — docker-build
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: docker-build

      - name: Завантажити образ у реєстр
        run: |
          IMAGE=ghcr.io/anastasik8/ci-lab-app
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:v1.0.0

      - name: Eco CI — docker-push
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: docker-push

      - name: Eco CI — підсумок
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: display-results
          display-badge: false

  deploy:
    needs: build-and-push-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Eco CI — старт вимірювання
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: start-measurement
          send-data: false
          co2-calculation-method: constant
          co2-grid-intensity-constant: 458

      - name: Отримати код репозиторію
        uses: actions/checkout@v4

      - name: Встановити Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
          -u ${{ github.actor }} --password-stdin

      - name: terraform init
        working-directory: infra
        run: terraform init

      - name: Перевірити форматування Terraform (terraform fmt)
        working-directory: infra
        run: terraform fmt -check

      - name: terraform apply
        working-directory: infra
        run: |
          IMAGE="ghcr.io/anastasik8"
          IMAGE="$IMAGE/ci-lab-app:${{ github.sha }}"
          terraform apply -auto-approve -var="image_name=$IMAGE"

      - name: Eco CI — terraform-apply
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: terraform-apply

      - name: Перевірити результат розгортання (smoke-test)
        run: |
          docker logs ci-lab-deploy
          EXIT_CODE=$(docker inspect ci-lab-deploy --format='{{.State.ExitCode}}')
          echo "Код завершення контейнера: $EXIT_CODE"
          test "$EXIT_CODE" -eq 0

      - name: Eco CI — smoke-test
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: smoke-test

      - name: terraform destroy
        if: always()
        continue-on-error: true
        working-directory: infra
        run: |
          IMAGE="ghcr.io/anastasik8"
          IMAGE="$IMAGE/ci-lab-app:${{ github.sha }}"
          terraform destroy -auto-approve -var="image_name=$IMAGE"

      - name: Eco CI — підсумок
        if: always()
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: display-results
          display-badge: false
