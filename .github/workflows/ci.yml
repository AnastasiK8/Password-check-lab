name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4

      - name: Налаштувати Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Встановити залежності (крок "збірки")
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Перевірити стиль коду (flake8)
        run: flake8 . --max-line-length=100

      - name: Запустити тести
        run: pytest -v